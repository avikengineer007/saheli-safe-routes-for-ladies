<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="SAHELI — AI-powered safe walking route finder and emergency guard for women and elders across all 28 states and 8 UTs of India. One-tap SOS, live GPS tracking, and community safety heatmap." />
    <meta property="og:title" content="SAHELI — Pan-India Safe Routes & Emergency Guard" />
    <meta property="og:description" content="Safe walking routes for sisters and elders across India. Live GPS tracking, community heatmap, and 1-tap SOS helplines." />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//unpkg.com" />
    <link rel="dns-prefetch" href="//saheli-backend-api.onrender.com" />
    <title>SAHELI — Pan-India Safe Routes & Emergency Guard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyByAV1XWmPwVHMAmvv61tUE_GR8-N0fLLc&libraries=places,geometry,directions" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[SAHELI SW] Registered:', reg.scope))
            .catch(err => console.warn('[SAHELI SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
